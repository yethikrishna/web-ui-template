name: Publish create-varsha

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: create-varsha
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_JSR == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jsr
        run: npm install -g jsr

      - name: Publish to JSR
        working-directory: create-varsha
        run: jsr publish --allow-dirty
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@yethikrishna'

      - name: Rename package for GitHub Packages
        working-directory: create-varsha
        run: npm pkg set name="@yethikrishna/create-varsha"

      - name: Publish to GitHub Packages
        working-directory: create-varsha
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yethikrishna/create-varsha
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: create-varsha
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-github-packages, publish-docker]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - Initial Release
          body: |
            ## create-varsha ${{ github.ref_name }}

            A premium Astro + Starlight starter template scaffolder by myndlabs.

            ### Features
            - Zero-dependency CLI using only Node.js built-in modules
            - Scaffolds new varsha projects via git clone or tarball fallback
            - Supports npm, yarn, pnpm, and bun package managers
            - Automatic dependency installation and git initialization
            - Cross-platform compatibility (Windows, macOS, Linux)

            ### Published To
            - [npm](https://www.npmjs.com/package/create-varsha)
            - [GitHub Packages](https://github.com/yethikrishna/web-ui-template/pkgs/npm/create-varsha)
            - [GitHub Container Registry](https://github.com/yethikrishna/web-ui-template/pkgs/container/create-varsha)

            ### Installation
            ```bash
            npx create-varsha my-site
            ```

            ### Usage
            ```bash
            npm create varsha my-site
            yarn create varsha my-site
            pnpm create varsha my-site
            bunx create-varsha my-site
            ```

            ### Docker
            ```bash
            docker run --rm -v ${PWD}:/workspace ghcr.io/yethikrishna/create-varsha my-site
            ```
          draft: false
          prerelease: false
